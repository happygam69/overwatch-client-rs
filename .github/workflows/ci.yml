# The gate, on every push to any branch and on every pull request.
#
# There is deliberately no `branches:` filter: the default branch is `master`,
# and a hardcoded name here (it said `main`) silently ran nothing at all for
# direct pushes. Do not add one back - a rename must not be able to turn the
# gate off.
#
# `cargo xtask verify` is the same gate the project runs locally: fmt, clippy
# (warnings are errors), every test target in the workspace, the dev/ tool
# index check, the deviations check, the address-frame check and the PE layout
# check.
#
# The runner is Windows because the D3D11 backend (`ow-render`) is
# `#![cfg(windows)]` and `ow-client` uses it unconditionally; on Linux that
# crate is empty and the client does not compile. CI has no Overwatch
# installation, so the integration tests that read one print a note and return
# - the gate still exercises every library target, including the verified
# movement and collision arithmetic in `ow-sim`.
#
# No game data is fetched, extracted or cached by this workflow; see
# CREDITS.md and AGENTS.md rule 1.

name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail fast on the first failing sub-step of the gate.
  CARGO_INCREMENTAL: 0

jobs:
  verify:
    name: cargo xtask verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, minimal profile)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: The gate (fmt, clippy, tests, dev index, deviations, addresses)
        run: cargo xtask verify
