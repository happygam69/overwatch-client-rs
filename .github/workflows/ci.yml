# The gate, on every push and pull request.
#
# `cargo xtask verify --fast` is the same gate the project runs locally:
# fmt, clippy (warnings are errors), the library and viewer test suites, the
# dev/ tool index check and the deviation check. The tests that read an
# Overwatch install are left out here — CI has no install; the fast gate is
# exactly what `--fast` selects for that case.
#
# No game data is fetched, extracted or cached by this workflow; see
# CREDITS.md and AGENTS.md rule 1.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail fast on the first failing sub-step of the gate.
  CARGO_INCREMENTAL: 0

jobs:
  verify:
    name: cargo xtask verify --fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, minimal profile)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: The gate (fmt, clippy, tests, dev index, deviations)
        run: cargo xtask verify --fast
