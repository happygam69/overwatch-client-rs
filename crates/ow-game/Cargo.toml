lints.workspace = true
[package]
name = "ow-game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Bevy shell: the movement and combat sandbox on the ow-sim core"

[[bin]]
name = "ow-game"
path = "src/main.rs"

[dependencies]
ow-sim = { path = "../ow-sim" }
ow-tank = { path = "../ow-tank" }
ow-casc = { path = "../ow-casc" }
ow-scene = { path = "../ow-scene" }
glam = "0.29"

# Bevy is the shell, never the simulation (see docs/rewrite-plan.md, "Bevy's
# role and boundary"): it owns the window, input, rendering and HUD and drives
# ow-sim from a fixed-timestep accumulator. The core stays engine-free, so a
# Bevy version bump is a change to this manifest and this crate alone.
bevy = { version = "0.14", default-features = false, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_winit",
    "bevy_ui",
    "bevy_text",
    "bevy_gizmos",
    "default_font",
    "multi_threaded",
    "png",
    "tonemapping_luts",
    "zstd",
] }

