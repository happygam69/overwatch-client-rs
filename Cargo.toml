[workspace]
resolver = "2"
members = [
    "crates/ow-casc",
    "crates/ow-engine",
    "crates/ow-scene",
    "crates/ow-client",
    "crates/ow-render",
    "crates/ow-sim",
    "crates/ow-stu",
    "crates/ow-tank",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT OR Apache-2.0"
repository = "https://github.com/happygam69/overwatch-client-rs"
description = "Clean-room Rust reimplementation of the Overwatch client, verified against your own install"

[workspace.lints.clippy]
# The readers mirror the shapes the client itself uses: wide argument lists,
# deeply nested option types and index loops over parallel arrays. The
# rewrites clippy suggests make those shapes harder to match against the
# client's code, so the lint is off rather than the code.
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"

[workspace.dependencies]
ow-casc = { path = "crates/ow-casc" }
ow-engine = { path = "crates/ow-engine" }
ow-scene = { path = "crates/ow-scene" }
ow-client = { path = "crates/ow-client" }
ow-render = { path = "crates/ow-render" }
ow-sim = { path = "crates/ow-sim" }
ow-stu = { path = "crates/ow-stu" }
ow-tank = { path = "crates/ow-tank" }

# Cryptography and compression used by the container and manifest layers.
aes = "0.8"
cbc = "0.1"
sha1 = "0.10"
flate2 = "1"

# Shared by the geometry and view crates; one place to bump.
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
