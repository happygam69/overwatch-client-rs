[workspace]
resolver = "2"
members = [
    "crates/ow-casc",
    "crates/ow-stu",
    "crates/ow-tank",
    "crates/ow-sim",
    "crates/ow-scene",
    "crates/ow-view",
    "crates/ow-game",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/ow-combat-rust"
description = "Clean-room Rust reader for a local Overwatch install's gameplay data"

[workspace.lints.clippy]
# The readers mirror the shapes the client itself uses: wide argument lists,
# deeply nested option types and index loops over parallel arrays. The
# rewrites clippy suggests make those shapes harder to match against the
# capture, so the lint is off rather than the code.
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"

[workspace.dependencies]
ow-casc = { path = "crates/ow-casc" }
ow-stu = { path = "crates/ow-stu" }
ow-tank = { path = "crates/ow-tank" }
ow-scene = { path = "crates/ow-scene" }
ow-sim = { path = "crates/ow-sim" }
ow-view = { path = "crates/ow-view" }
ow-game = { path = "crates/ow-game" }

# Cryptography and compression used by the container and manifest layers.
aes = "0.8"
cbc = "0.1"
sha1 = "0.10"
flate2 = "1"

[profile.release]
opt-level = 3
